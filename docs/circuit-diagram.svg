<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670"><title>NodeMCU BME280 OLED and RGB usage indicator</title><rect width="1080" height="670" fill="#fff"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID17: ESP8266 NodeMCU • USB5V input • peripherals and I/O3.3V</text><rect x="40" y="90" width="350" height="445" fill="#dfeef9" stroke="#123"/><text x="60" y="125">NodeMCU</text><text x="60" y="180">D2 / GPIO4 SDA</text><text x="60" y="235">D1 / GPIO5 SCL</text><text x="60" y="290">D6 / GPIO12 R</text><text x="60" y="345">D7 / GPIO13 G</text><text x="60" y="400">D5 / GPIO14 B</text><text x="60" y="455">3V3 rail</text><text x="60" y="510">GND rail</text><rect x="690" y="80" width="345" height="150" fill="#edf9eb" stroke="#123"/><text x="710" y="115">BME2800x76</text><text x="710" y="155">SDA4;SCL5;VCC3V3;GND</text><text x="710" y="200">CSB3V3;SDO GND (I2C)</text><rect x="690" y="250" width="345" height="100" fill="#edf9eb" stroke="#123"/><text x="710" y="285">OLED SSD1306 128×64 0x3C</text><text x="710" y="327">SDA4;SCL5;VCC3V3;GND</text><rect x="690" y="380" width="345" height="125" fill="#edf9eb" stroke="#123"/><text x="710" y="415">Common-cathode RGB</text><text x="710" y="455">R←12;G←13;B←14</text><text x="710" y="490">each via330Ω;common K→GND</text><text x="25" y="585">Shared I2C: both SDA→GPIO4 and both SCL→GPIO5. Pullups to3.3V only.</text><text x="25" y="630">All peripheral VCC→3V3 and GND→common return. Never feed5V into GPIO.</text></g><g stroke="#267" stroke-width="3" fill="none"><path d="M390 175H530V145H690M530 175V310H690"/><path d="M390 230H590V175H690M590 230V335H690"/><path d="M390 285H490V420H690M390 340H470V450H690M390 395H450V480H690"/><path d="M390 450H420V550H1035M390 505H440V565H1035"/></g></svg>